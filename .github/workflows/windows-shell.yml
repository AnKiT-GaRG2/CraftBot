name: Windows shell regressions

on:
  push:
    paths:
      - 'app/data/action/run_shell.py'
      - 'app/data/action/run_powershell.py'
      - 'tests/windows_shell/**'
      - '.github/workflows/windows-shell.yml'
  pull_request:
    paths:
      - 'app/data/action/run_shell.py'
      - 'app/data/action/run_powershell.py'
      - 'tests/windows_shell/**'
      - '.github/workflows/windows-shell.yml'

jobs:
  shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify real cmd and Windows PowerShell execution
        run: python -m unittest discover -s tests/windows_shell -v
